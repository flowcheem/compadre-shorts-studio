name: Cloud video render

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: "Object key of the source video inside the private R2 bucket"
        required: true
        type: string
      clip_seconds:
        description: "Target duration of each clip (15–180 seconds)"
        required: true
        default: "60"
        type: string
      max_clips:
        description: "Maximum number of clips to render (1–30)"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: compadre-cloud-render-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SOURCE_KEY: ${{ inputs.source_key }}
      CLIP_SECONDS: ${{ inputs.clip_seconds }}
      MAX_CLIPS: ${{ inputs.max_clips }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

    steps:
      - name: Validate inputs and credentials
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import PurePosixPath

          key = os.environ["SOURCE_KEY"]
          path = PurePosixPath(key)
          if not key or key.startswith("/") or ".." in path.parts:
              raise SystemExit("source_key must be a relative object key inside the configured bucket")
          if not all(os.environ.get(name) for name in (
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "R2_ACCOUNT_ID", "R2_BUCKET"
          )):
              raise SystemExit("One or more required R2 GitHub secrets are missing")
          for name, low, high in (("CLIP_SECONDS", 15, 180), ("MAX_CLIPS", 1, 30)):
              try:
                  value = int(os.environ[name])
              except ValueError:
                  raise SystemExit(f"{name} must be an integer")
              if not low <= value <= high:
                  raise SystemExit(f"{name} must be between {low} and {high}")
          PY
          aws --version

      - name: Check out cloud rendering code
        uses: actions/checkout@v4
        with:
          ref: feature/cloud-free-pipeline
          persist-credentials: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download source privately from R2
        run: |
          set -euo pipefail
          mkdir -p work/output
          aws s3 cp "s3://${R2_BUCKET}/${SOURCE_KEY}" work/source-video \
            --endpoint-url "$R2_ENDPOINT"
          size=$(stat -c%s work/source-video)
          echo "Source size: $size bytes"
          if [ "$size" -gt 6000000000 ]; then
            echo "Source exceeds the 6 GB safety limit for this hosted runner."
            exit 1
          fi
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 work/source-video

      - name: Install Compadre Shorts Studio
        run: |
          python -m pip install .
          compadre-shorts --help

      - name: Render vertical clips with safe framing
        run: |
          set -euo pipefail
          compadre-shorts work/source-video \
            --output work/output \
            --mode sequential \
            --duration "$CLIP_SECONDS" \
            --min-seconds 15 \
            --max-clips "$MAX_CLIPS" \
            --style viral \
            --audio-processing normalize \
            --framing safe
          test -s work/output/manifest.json
          find work/output -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Package and upload results privately to R2
        run: |
          set -euo pipefail
          archive="compadre-shorts-${GITHUB_RUN_ID}.zip"
          (cd work && zip -qr "../$archive" output)
          aws s3 cp "$archive" \
            "s3://${R2_BUCKET}/outputs/${GITHUB_RUN_ID}/$archive" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Private result: outputs/${GITHUB_RUN_ID}/$archive"
